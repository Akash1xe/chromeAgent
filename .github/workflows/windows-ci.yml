name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-readiness:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run backend unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          --ignore=test_browser_runtime.py
          --ignore=test_browser_capabilities.py

      - name: Test Chromium browser primitives
        working-directory: backend
        timeout-minutes: 4
        env:
          PYTHONPATH: .
        run: python -m pytest -vv -s test_browser_capabilities.py

      - name: Test Browser Use CDP attachment
        working-directory: backend
        timeout-minutes: 4
        env:
          PYTHONPATH: .
        run: python -m pytest -vv -s test_browser_runtime.py

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run environment doctor
        working-directory: backend
        run: python doctor.py

      - name: Compile launcher
        run: python -m py_compile run.py backend/doctor.py backend/acceptance_benchmark.py

      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\setup.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
